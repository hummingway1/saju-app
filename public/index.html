<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fixed Picker</title>

<style>
body {
  margin:0;
  font-family:sans-serif;
}

.drum {
  height:200px;
  overflow:hidden;
  border:1px solid #ccc;

  /* ⭐ 핵심 수정 */
  touch-action: none;
  overscroll-behavior: contain;
}

.item {
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
}
</style>
</head>

<body>

<div class="drum" id="drum"></div>

<script>
let drag = { on:false, sY:0, dy:0 };
let offset = 0;

const el = document.getElementById("drum");

el.innerHTML = Array.from({length:50}, (_,i)=>`<div class="item">${i}</div>`).join("");

el.addEventListener("touchstart", e=>{
  drag.on = true;
  drag.sY = e.touches[0].clientY;
}, { passive:false });

window.addEventListener("touchmove", e=>{
  if(!drag.on) return;
  e.preventDefault(); // ⭐ 핵심
  offset += drag.sY - e.touches[0].clientY;
  drag.sY = e.touches[0].clientY;
  el.scrollTop = offset;
}, { passive:false });

window.addEventListener("touchend", ()=>{
  drag.on = false;
});
</script>

</body>
</html>
