<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>천명</title>

<style>
body {
  margin:0;
  font-family:sans-serif;
  background:#0b0b0f;
  color:#eee;
}

.field {
  margin:20px;
}

.label {
  font-size:12px;
  margin-bottom:8px;
  color:#aaa;
}

.select-box {
  padding:14px;
  border:1px solid #333;
  border-radius:10px;
  background:#111;
  cursor:pointer;
}

/* 바텀시트 */
.sheet {
  position:fixed;
  bottom:-100%;
  left:0;
  right:0;
  height:60%;
  background:#111;
  border-top:1px solid #333;
  overflow-y:auto;
  transition:0.3s;
  z-index:1000;
}

.sheet.active {
  bottom:0;
}

.item {
  padding:16px;
  border-bottom:1px solid #222;
  text-align:center;
}

.item:hover {
  background:#222;
}

button {
  width:90%;
  margin:20px;
  padding:16px;
  border:none;
  border-radius:10px;
  background:#c9a96e;
  color:#000;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="field">
  <div class="label">생년</div>
  <div class="select-box" onclick="openSheet('year')">
    <span id="yearText">선택</span>
  </div>
</div>

<div class="field">
  <div class="label">월</div>
  <div class="select-box" onclick="openSheet('month')">
    <span id="monthText">선택</span>
  </div>
</div>

<div class="field">
  <div class="label">일</div>
  <div class="select-box" onclick="openSheet('day')">
    <span id="dayText">선택</span>
  </div>
</div>

<div class="field">
  <div class="label">출생 시각</div>
  <div class="select-box" onclick="openSheet('hour')">
    <span id="hourText">선택</span>
  </div>
</div>

<button onclick="submit()">분석하기</button>

<div id="sheet" class="sheet"></div>

<script>
let state = {
  year:null,
  month:null,
  day:null,
  hour:null
};

/* 🔥 저장 불러오기 */
const saved = localStorage.getItem("sajuData");
if(saved){
  state = JSON.parse(saved);

  if(state.year) document.getElementById("yearText").innerText = state.year;
  if(state.month) document.getElementById("monthText").innerText = state.month;
  if(state.day) document.getElementById("dayText").innerText = state.day;
  if(state.hour !== null) document.getElementById("hourText").innerText = state.hour;
}

function openSheet(type){
  const sheet = document.getElementById("sheet");
  sheet.innerHTML = "";

  let list = [];

  if(type === "year"){
    for(let i=new Date().getFullYear();i>=1920;i--) list.push(i);
  }
  if(type === "month"){
    for(let i=1;i<=12;i++) list.push(i);
  }
  if(type === "day"){
    const days = new Date(state.year || 2000, state.month || 1, 0).getDate();
    for(let i=1;i<=days;i++) list.push(i);
  }
  if(type === "hour"){
    list = ["모름"];
    for(let i=0;i<24;i++) list.push(i);
  }

  list.forEach(v=>{
    const div = document.createElement("div");
    div.className = "item";
    div.innerText = v;

    div.onclick = ()=>{
      state[type] = v;
      document.getElementById(type+"Text").innerText = v;
      sheet.classList.remove("active");

      /* 🔥 자동 저장 */
      localStorage.setItem("sajuData", JSON.stringify(state));
    };

    sheet.appendChild(div);
  });

  sheet.classList.add("active");
}

function submit(){
  if(!state.year || !state.month || !state.day){
    alert("생년월일을 모두 선택해라");
    return;
  }

  localStorage.setItem("sajuData", JSON.stringify(state));

  alert("완료: " + JSON.stringify(state));
}
</script>

</body>
</html>
