<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>천명 · 天命 — BaZi & Destiny Analysis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    
    :root {
      --gold: #c9a96e;
      --gold-dim: #c9a96e44;
      --bg: #0a0806;
      --bg2: #11100d;
      --bg3: #15120e;
      --text: #c8b89a;
      --text-bright: #e8d5b0;
      --text-dim: #3a3028;
      --text-muted: #6b5a3e;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Serif KR', serif;
      overflow-x: hidden;
    }

    /* 언어 토글 */
    .lang-toggle {
      position: fixed; top: 16px; right: 16px;
      z-index: 300;
      display: flex;
      background: var(--bg2); border: 1px solid #2a2418;
      border-radius: 20px; overflow: hidden;
    }
    .lang-btn {
      padding: 7px 14px; font-size: 11px; letter-spacing: 2px;
      cursor: pointer; border: none; background: transparent;
      color: var(--text-dim); font-family: 'Noto Serif KR', serif;
      transition: all 0.2s;
    }
    .lang-btn.active { background: var(--gold); color: var(--bg); font-weight: 600; }

    /* 음악 토글 */
    .sound-toggle {
      position: fixed; top: 16px; left: 16px;
      z-index: 300;
      width: 36px; height: 36px;
      background: var(--bg2); border: 1px solid #2a2418;
      border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: var(--text-dim);
      transition: all 0.3s;
    }
    .sound-toggle.active { border-color: var(--gold-dim); color: var(--gold); }

    /* 별 배경 */
    #stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

    /* 안개 효과 */
    .fog {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse at 50% 0%, #c9a96e08 0%, transparent 60%),
                  radial-gradient(ellipse at 20% 80%, #1a0a0508 0%, transparent 50%);
    }

    .wrap {
      position: relative; z-index: 1;
      max-width: 520px; margin: 0 auto; padding: 0 20px;
    }

    /* 히어로 */
    .hero { text-align: center; padding: 72px 0 48px; }
    .hero-icon {
      display: inline-flex; width: 56px; height: 56px;
      border-radius: 50%; border: 1px solid var(--gold-dim);
      align-items: center; justify-content: center;
      font-size: 24px; color: var(--gold);
      background: var(--bg3); box-shadow: 0 0 60px #c9a96e18;
      margin-bottom: 24px;
      animation: pulse-glow 4s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 40px #c9a96e15; }
      50% { box-shadow: 0 0 80px #c9a96e30; }
    }
    .hero h1 {
      font-size: clamp(22px, 6vw, 34px);
      font-weight: 300; letter-spacing: 12px; color: var(--text-bright);
      margin-bottom: 8px; font-family: 'Cormorant Garamond', serif;
    }
    .hero p { font-size: 11px; color: var(--text-dim); letter-spacing: 6px; }
    .hero-line {
      width: 1px; height: 40px;
      background: linear-gradient(var(--gold-dim), transparent);
      margin: 22px auto 0;
    }

    .field-label {
      font-size: 10px; color: var(--text-muted);
      letter-spacing: 5px; text-align: center; margin-bottom: 14px;
    }

    .picker-box {
      background: var(--bg2); border: 1px solid #222018;
      border-radius: 16px; padding: 16px 10px;
      display: flex; justify-content: center;
      align-items: flex-start; gap: 4px; margin-bottom: 32px;
    }
    .picker-sep { color: #222018; font-size: 20px; padding-top: 62px; }
    .picker-sep.dim { color: #1a1810; }

    .drum-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .drum-label { font-size: 10px; color: var(--text-muted); letter-spacing: 3px; }
    .drum-label.disabled { color: #252018; }
    .drum {
      overflow: hidden; position: relative; border-radius: 12px; cursor: grab;
      background: linear-gradient(180deg, var(--bg), #14110e 25%, #14110e 75%, var(--bg));
      user-select: none;
    }
    .drum.disabled { opacity: 0.25; cursor: default; }
    .drum-fade-top { position: absolute; top: 0; left: 0; right: 0; pointer-events: none; z-index: 2; background: linear-gradient(180deg, var(--bg), transparent); }
    .drum-fade-bot { position: absolute; bottom: 0; left: 0; right: 0; pointer-events: none; z-index: 2; background: linear-gradient(0deg, var(--bg), transparent); }
    .drum-selector { position: absolute; left: 6px; right: 6px; border: 1px solid #c9a96e44; border-radius: 8px; background: #c9a96e08; z-index: 1; pointer-events: none; }
    .drum-list { position: absolute; left: 0; right: 0; transition: transform 0.22s cubic-bezier(.25,.8,.25,1); }
    .drum-item { display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif KR', serif; transition: all 0.1s; cursor: pointer; }
    .drum-item.active { color: var(--text-bright); font-weight: 500; }
    .drum-item.near { color: #5a4a32; }
    .drum-item.far { color: #222018; }

    .gender-wrap { display: flex; gap: 10px; margin-bottom: 36px; }
    .gender-btn {
      flex: 1; padding: 20px 12px;
      background: var(--bg2); border: 1px solid #222018;
      border-radius: 14px; cursor: pointer;

    }

    .gender-btn .hanja { font-size: 26px; color: #2e2820; transition: color 0.2s; }
    .gender-btn.active .hanja { color: var(--text-bright); }
    .gender-btn .ko { font-size: 10px; letter-spacing: 4px; color: #2e2820; transition: color 0.2s; }
    .gender-btn.active .ko { color: var(--gold); }

    .analyze-btn {
      width: 100%; padding: 16px; border: none; border-radius: 13px;
      font-size: 13px; letter-spacing: 7px;
      font-family: 'Noto Serif KR', serif; font-weight: 600;
      cursor: not-allowed; transition: all 0.3s; margin-bottom: 12px;
      background: var(--bg3); color: #2a2218;
    }
    .analyze-btn.ready {
      background: linear-gradient(135deg, var(--gold), #a07840);
      color: var(--bg); cursor: pointer; box-shadow: 0 6px 24px #c9a96e28;
    }
    .hint { text-align: center; font-size: 11px; color: #252018; letter-spacing: 2px; margin-bottom: 4px; }

    .error-box {

      border-radius: 10px; color: #ff9090; font-size: 12px; line-height: 1.7;
      word-break: break-all; display: none;
    }

    /* 로딩 */
    #loading {
      display: none; position: fixed; inset: 0; background: var(--bg);
      z-index: 200; flex-direction: column; align-items: center; justify-content: center; gap: 32px;
    }
    .spinner-wrap { position: relative; width: 88px; height: 88px; }
    .ring { position: absolute; border-radius: 50%; border: 1px solid transparent; }
    .ring-1 { inset: 0; border-top-color: #c9a96e33; animation: zspin 4s linear infinite; }
    .ring-2 { inset: 12px; border-top-color: #c9a96e55; animation: zspin 2.4s linear infinite reverse; }
    .ring-3 { inset: 24px; border-top-color: #c9a96e99; animation: zspin 1.4s linear infinite; }
    .spinner-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 24px; color: var(--gold); }
    .loading-text { text-align: center; }
    .loading-msg { font-size: 14px; color: var(--gold); letter-spacing: 3px; }
    .loading-sub { font-size: 11px; color: var(--text-dim); margin-top: 8px; letter-spacing: 2px; }
    @keyframes zspin { to { transform: rotate(360deg); } }

    /* 결과 */
    #result { display: none; }
    .result-header { text-align: center; padding: 0 0 40px; border-bottom: 1px solid #181410; }
    .result-meta { font-size: 10px; color: var(--text-dim); letter-spacing: 4px; margin-bottom: 20px; }
    .result-headline { font-size: clamp(16px, 4vw, 22px); color: var(--text-bright); font-weight: 300; line-height: 1.8; margin-bottom: 20px; font-family: 'Cormorant Garamond', serif; font-style: italic; }
    .result-essence { font-size: 13.5px; color: #7a6a4a; line-height: 2.1; font-weight: 300; }

    .section {
      padding: 34px 0; border-bottom: 1px solid #181410;

    .section-body { font-size: 15px; line-height: 2.2; color: #baa880; font-weight: 300; }

    /* 잠금 섹션 */
    .locked-section-wrap {
      margin-top: 40px; border-top: 1px solid #181410;
      padding-top: 40px;
    }
    .locked-header {
      text-align: center; margin-bottom: 32px;
    }
    .locked-header h3 {
      font-size: 11px; color: var(--text-muted); letter-spacing: 6px;
      font-weight: 400; margin-bottom: 8px;
    }
    .locked-header p {
      font-size: 12px; color: #2e2820; letter-spacing: 2px;
    }

    .locked-card {
      position: relative; margin-bottom: 16px;
      border-radius: 14px; overflow: hidden;
      border: 1px solid #1a1810;
    }
    .locked-card-inner {
      padding: 24px; background: var(--bg2);
      filter: blur(4px); user-select: none; pointer-events: none;
    }
    .locked-card-title {
      font-size: 10px; color: var(--text-muted); letter-spacing: 5px; margin-bottom: 10px;
    }
    .locked-card-preview {
      font-size: 13px; color: #4a3a28; line-height: 2; height: 60px; overflow: hidden;
    }
    .locked-overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
      background: linear-gradient(180deg, transparent, #0a0806cc);
    }
    .lock-icon { font-size: 20px; color: var(--gold); opacity: 0.7; }
    .locked-label {
      font-size: 10px; color: var(--text-muted); letter-spacing: 4px;
    }

    /* 결제 버튼 */
    .unlock-section {
      text-align: center; padding: 40px 0 20px;
    }
    .unlock-btn {
      display: inline-flex; flex-direction: column; align-items: center;
      width: 100%; padding: 20px;
      background: linear-gradient(135deg, #1a1510, #2a1f10);
      border: 1px solid var(--gold-dim); border-radius: 16px;
      cursor: pointer; transition: all 0.3s; text-decoration: none;
      gap: 4px;
    }
    .unlock-btn:hover { border-color: var(--gold); box-shadow: 0 0 40px #c9a96e18; }
    .unlock-btn-label { font-size: 10px; color: var(--text-muted); letter-spacing: 5px; }
    .unlock-btn-price { font-size: 28px; color: var(--gold); font-family: 'Cormorant Garamond', serif; font-weight: 300; }
    .unlock-btn-sub { font-size: 11px; color: #3a3028; letter-spacing: 2px; }
    .unlock-features {
      margin-top: 16px; display: flex; flex-direction: column; gap: 6px;
      text-align: left;
    }
    .unlock-feature {
      font-size: 11px; color: #4a3a28; letter-spacing: 1px;
      display: flex; align-items: center; gap: 8px;
    }
    .unlock-feature span { color: var(--gold); font-size: 10px; }

    .reset-wrap { padding: 50px 0 80px; text-align: center; }
    .reset-btn {
      background: transparent; border: 1px solid #222018;
      border-radius: 10px; padding: 10px 28px;
      color: var(--text-muted); font-size: 12px; letter-spacing: 5px;
      cursor: pointer; font-family: 'Noto Serif KR', serif; transition: all 0.2s;
    }
    .reset-btn:hover { color: var(--gold); border-color: var(--gold-dim); }
    .disclaimer { margin-top: 24px; font-size: 10px; color: #1a1810; letter-spacing: 2px; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    .fade-in { animation: fadeIn 0.7s ease both; }
  </style>
</head>

<script>
/* ── 싱잉볼 오디오 ── */
let audioCtx = null;
let soundOn = false;
let soundNodes = [];

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSingingBowl(freq, duration, delay = 0) {
  if (!audioCtx || !soundOn) return;
  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();

  filter.type = 'bandpass';
  filter.frequency.value = freq;
  filter.Q.value = 15;

  osc.connect(filter);
  filter.connect(gainNode);
  gainNode.connect(audioCtx.destination);

  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
  osc.frequency.setTargetAtTime(freq * 0.998, audioCtx.currentTime + delay + 0.1, 2);

  gainNode.gain.setValueAtTime(0, audioCtx.currentTime + delay);
  gainNode.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + delay + 0.3);
  gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);

  osc.start(audioCtx.currentTime + delay);
  osc.stop(audioCtx.currentTime + delay + duration);
  soundNodes.push(osc);
}

function playDroneLayer() {
  if (!audioCtx || !soundOn) return;
  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  osc.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.value = 55;
  gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
  gainNode.gain.linearRampToValueAtTime(0.03, audioCtx.currentTime + 3);
  osc.start();
  soundNodes.push(osc);
  return { osc, gainNode };
}

let droneNodes = null;
let bowlTimer = null;

function startAmbient() {
  if (!audioCtx) return;
  droneNodes = playDroneLayer();

  const bowlFreqs = [220, 329.6, 440, 293.7, 369.9];
  let i = 0;
  function scheduleBowl() {
    if (!soundOn) return;
    const freq = bowlFreqs[i % bowlFreqs.length];
    playSingingBowl(freq, 8 + Math.random() * 4);
    i++;
    bowlTimer = setTimeout(scheduleBowl, 6000 + Math.random() * 8000);
  }
  scheduleBowl();
}

function stopAmbient() {
  if (bowlTimer) clearTimeout(bowlTimer);
  soundNodes.forEach(n => { try { n.stop(); } catch(e){} });
  soundNodes = [];
  if (droneNodes) {
    try {
      droneNodes.gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 2);
      setTimeout(() => { try { droneNodes.osc.stop(); } catch(e){} }, 2100);
    } catch(e){}
    droneNodes = null;
  }
}

function toggleSound() {
  initAudio();
  soundOn = !soundOn;
  const btn = document.getElementById('sound-btn');
  if (soundOn) {
    btn.classList.add('active');
    startAmbient();
  } else {
    btn.classList.remove('active');
    stopAmbient();
  }
}

/* ── 언어 설정 ── */
const T = {
  ko: {
    heroTitle: "천 명", heroSub: "CHEONMYEONG · 天命",
    labelDate: "생년월일", labelYear: "년", labelMonth: "월", labelDay: "일",
    labelTimeSection: "출생 시각", labelHour: "시", labelMinute: "분",
    labelGender: "성별", textMale: "남", textFemale: "여",

/* ── 드럼 피커 ── */
const ITEM_H = 44, VISIBLE = 5;
function createDrum(el, items, initVal, onChange, disabled) {
  const H = ITEM_H * VISIBLE;
  el.style.height = H + "px";
  el.innerHTML = "";
  if (disabled) el.classList.add("disabled");
  else el.classList.remove("disabled");

  let baseIdx = Math.max(0, items.indexOf(initVal));
  let drag = { on: false, startY: 0, dy: 0 };

  const fadeT = document.createElement("div"); fadeT.className = "drum-fade-top"; fadeT.style.height = ITEM_H * 2 + "px";
  const fadeB = document.createElement("div"); fadeB.className = "drum-fade-bot"; fadeB.style.height = ITEM_H * 2 + "px";
  const sel = document.createElement("div"); sel.className = "drum-selector"; sel.style.cssText = `top:${ITEM_H*2}px;height:${ITEM_H}px`;
  const list = document.createElement("div"); list.className = "drum-list";

  items.forEach((item, i) => {
    const d = document.createElement("div");
    d.className = "drum-item far"; d.style.height = ITEM_H + "px"; d.style.fontSize = "13px";
    d.textContent = item;
    d.onclick = () => { if (!disabled) { baseIdx = i; render(); onChange(items[i]); } };
    list.appendChild(d);
  });
  el.appendChild(fadeT); el.appendChild(fadeB); el.appendChild(sel); el.appendChild(list);

  function clamp(v) { return Math.max(0, Math.min((items.length-1)*ITEM_H, v)); }
  function snapI(v) { return Math.round(clamp(v) / ITEM_H); }
  function liveRaw() { return baseIdx * ITEM_H + (drag.on ? drag.dy : 0); }

  function render() {
    const ai = snapI(liveRaw());
    const ty = -clamp(liveRaw()) + ITEM_H * 2;
    list.style.transition = drag.on ? "none" : "transform 0.22s cubic-bezier(.25,.8,.25,1)";
    list.style.transform = `translateY(${ty}px)`;
    list.childNodes.forEach((d, i) => {
      const dist = Math.abs(i - ai);
      d.className = "drum-item " + (dist===0?"active":dist===1?"near":"far");
      d.style.fontSize = dist===0?"19px":"13px";
      d.style.fontWeight = dist===0?"500":"400";
    });
  }
  render();

  if (!disabled) {
    el.addEventListener("mousedown", e => { drag = {on:true,startY:e.clientY,dy:0}; });
    el.addEventListener("touchstart", e => { drag = {on:true,startY:e.touches[0].clientY,dy:0}; e.preventDefault(); }, {passive:false});
    window.addEventListener("mousemove", e => { if(!drag.on) return; drag.dy = drag.startY - e.clientY; render(); });
    window.addEventListener("touchmove", e => { if(!drag.on) return; drag.dy = drag.startY - e.touches[0].clientY; render(); });
    window.addEventListener("mouseup", () => { if(!drag.on) return; baseIdx=snapI(liveRaw()); drag={on:false,startY:0,dy:0}; onChange(items[baseIdx]); render(); });
    window.addEventListener("touchend", () => { if(!drag.on) return; baseIdx=snapI(liveRaw()); drag={on:false,startY:0,dy:0}; onChange(items[baseIdx]); render(); });
  }
  return {
    setValue(val) { const i=items.indexOf(val); if(i>=0){baseIdx=i;render();} },
    enable() { el.classList.remove("disabled"); disabled=false; },
    disable() { el.classList.add("disabled"); disabled=true; }
  };
}

const CY = new Date().getFullYear();
const years = Array.from({length:110}, (_,i) => CY - i);
const months = Array.from({length:12}, (_,i) => i+1);
let state = { year:1990, month:6, day:15, hour:null, minute:null, gender:null };

function getDays(y, m) { return Array.from({length: new Date(y,m,0).getDate()}, (_,i)=>i+1); }
function getHours() { const t=T[currentLang]; return [t.hourUnknown, ...Array.from({length:24},(_,i)=>String(i).padStart(2,"0"))]; }
function getMinutes() { const t=T[currentLang]; return [t.minuteUnknown, ...Array.from({length:60},(_,i)=>String(i).padStart(2,"0"))]; }

/* 별 생성 */
(function() {
  const svg = document.getElementById("stars");
  for (let i = 0; i < 120; i++) {
    const x = (Math.sin(i*137.508)*0.5+0.5)*100;
    const y = (Math.cos(i*97.31)*0.5+0.5)*100;
    const r = i%7===0?1.4:i%3===0?0.9:0.5;
    const o = 0.08+(i%5)*0.06;
    const c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",x+"%"); c.setAttribute("cy",y+"%");
    c.setAttribute("r",r); c.setAttribute("fill","#e8d5b0"); c.setAttribute("opacity",o);
    svg.appendChild(c);
  }
})();

let drumYear, drumMonth, drumDay, drumHour, drumMinute;

function initPickers() {
  drumYear = createDrum(document.getElementById("drum-year"), years, state.year, v => { state.year=v; refreshDays(); }, false);
  drumMonth = createDrum(document.getElementById("drum-month"), months, state.month, v => { state.month=v; refreshDays(); }, false);
  let dayItems = getDays(state.year, state.month);
  drumDay = createDrum(document.getElementById("drum-day"), dayItems, state.day, v => { state.day=v; }, false);
  const hours = getHours();
  state.hour = hours[0];
  drumHour = createDrum(document.getElementById("drum-hour"), hours, state.hour, v => {
    state.hour = v;
    const t = T[currentLang];
    const noTime = v === t.hourUnknown;
    document.getElementById("time-hint").style.display = noTime ? "block" : "none";
    document.getElementById("sep-time").className = "picker-sep" + (noTime ? " dim" : "");
    document.getElementById("label-minute").className = "drum-label" + (noTime ? " disabled" : "");
    if (noTime) { drumMinute.disable(); state.minute = t.minuteUnknown; }
    else drumMinute.enable();
  }, false);
  const minutes = getMinutes();
  state.minute = minutes[0];
  drumMinute = createDrum(document.getElementById("drum-minute"), minutes, state.minute, v => { state.minute=v; }, true);
}

function rebuildTimePickers() {
  const hours = getHours();
  const minutes = getMinutes();
  drumHour = createDrum(document.getElementById("drum-hour"), hours, hours[0], v => {
    state.hour = v;
    const t = T[currentLang];
    const noTime = v === t.hourUnknown;
    document.getElementById("time-hint").style.display = noTime ? "block" : "none";
    document.getElementById("sep-time").className = "picker-sep" + (noTime ? " dim" : "");
    document.getElementById("label-minute").className = "drum-label" + (noTime ? " disabled" : "");
    if (noTime) { drumMinute.disable(); state.minute = t.minuteUnknown; }
    else drumMinute.enable();
  }, false);
  state.hour = hours[0];
  drumMinute = createDrum(document.getElementById("drum-minute"), minutes, minutes[0], v => { state.minute=v; }, true);
  state.minute = minutes[0];
  document.getElementById("time-hint").style.display = "block";
}

function refreshDays() {
  const newDays = getDays(state.year, state.month);
  const el = document.getElementById("drum-day");
  el.innerHTML = "";
  const newVal = state.day > newDays.length ? newDays[newDays.length-1] : state.day;
  state.day = newVal;
  drumDay = createDrum(el, newDays, newVal, v => { state.day=v; }, false);
}

function selectGender(g) {
  state.gender = g;
  document.getElementById("btn-male").className = "gender-btn" + (g==="male"?" active":"");
  document.getElementById("btn-female").className = "gender-btn" + (g==="female"?" active":"");
  document.getElementById("gender-hint").style.display = "none";
  document.getElementById("analyze-btn").className = "analyze-btn ready";
}

let msgTimer;
function startLoadingMsgs() {
  const msgs = T[currentLang].loading;
  let i = 0;
  document.getElementById("loading-msg").textContent = msgs[0];
  msgTimer = setInterval(() => { i=(i+1)%msgs.length; document.getElementById("loading-msg").textContent = msgs[i]; }, 1800);
}
function stopLoadingMsgs() { clearInterval(msgTimer); }

async function analyze() {
  if (!state.gender) return;
  const t = T[currentLang];
  document.getElementById("error-box").style.display = "none";
  document.getElementById("loading").style.display = "flex";
  document.getElementById("form-section").style.display = "none";
  startLoadingMsgs();

  const hourVal = (state.hour === t.hourUnknown) ? "모름" : state.hour;
  const minuteVal = (state.minute === t.minuteUnknown || state.minute === "—") ? "모름" : state.minute;

  try {
    const res = await fetch("/api/analyze", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ year:state.year, month:state.month, day:state.day, hour:hourVal, minute:minuteVal, gender:state.gender, lang:currentLang })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    stopLoadingMsgs();
    document.getElementById("loading").style.display = "none";
    showResult(data);
  } catch(e) {
    stopLoadingMsgs();
    document.getElementById("loading").style.display = "none";
    document.getElementById("form-section").style.display = "block";
    const eb = document.getElementById("error-box");
    eb.textContent = (currentLang==="ko"?"오류: ":"Error: ") + e.message;
    eb.style.display = "block";
  }
}

function showResult(data) {
  const t = T[currentLang];
  const genderLabel = state.gender==="male" ? t.genderMale : t.genderFemale;
  document.getElementById("result-meta").textContent =
    currentLang==="ko"
      ? `${state.year}년 ${state.month}월 ${state.day}일 · ${genderLabel}`
      : `${state.month}/${state.day}/${state.year} · ${genderLabel}`;
  document.getElementById("result-headline").textContent = data.headline || "";
  document.getElementById("result-essence").textContent = data.essence || "";

  const container = document.getElementById("result-sections");
  container.innerHTML = "";
  (data.sections || []).forEach((sec, i) => {
    const div = document.createElement("div");
    div.className = "section";
    div.style.transitionDelay = (i*0.07)+"s";
    div.innerHTML = `<div class="section-title-wrap"><span class="section-icon">${sec.icon}</span><span class="section-title">${sec.title}</span></div><div class="section-body">${sec.body}</div>`;
    container.appendChild(div);
  });

  // 잠금 섹션 렌더링
  if (data.locked) {
    const wrap = document.getElementById("locked-wrap");
    wrap.style.display = "block";
    const cards = document.getElementById("locked-cards");
    cards.innerHTML = "";
    const cy = new Date().getFullYear();
    const cm = new Date().getMonth() + 1;

    const lockedItems = [
      { title: t.periods[0], preview: data.locked.periods?.early || "" },
      { title: t.periods[1], preview: data.locked.periods?.mid || "" },
      { title: t.periods[2], preview: data.locked.periods?.late || "" },
      { title: `${cy}${t.yearly}`, preview: data.locked.yearly?.[0]?.fortune || "" },
      { title: `${cy+1}${t.yearly}`, preview: data.locked.yearly?.[1]?.fortune || "" },
      { title: currentLang==="ko" ? `${cm}월 월운` : t.monthly, preview: data.locked.monthly || "" },
      { title: t.daily, preview: data.locked.daily || "" },
    ];

    lockedItems.forEach(item => {
      const card = document.createElement("div");
      card.className = "locked-card";
      card.innerHTML = `
        <div class="locked-card-inner">
          <div class="locked-card-title">${item.title}</div>
          <div class="locked-card-preview">${item.preview.substring(0, 80)}...</div>
        </div>
        <div class="locked-overlay">
          <div class="lock-icon">🔒</div>
          <div class="locked-label">${t.locked}</div>
        </div>`;
      cards.appendChild(card);
    });
  }

  document.getElementById("result").style.display = "block";
  window.scrollTo({top:0, behavior:"smooth"});

  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if(e.isIntersecting) e.target.classList.add("visible"); });
  }, {threshold:0.05});
  document.querySelectorAll(".section").forEach(s => obs.observe(s));
}

function resetApp() {
  document.getElementById("result").style.display = "none";
  document.getElementById("locked-wrap").style.display = "none";
  document.getElementById("form-section").style.display = "block";
  window.scrollTo({top:0, behavior:"smooth"});
}

initPickers();
setLang(currentLang);
