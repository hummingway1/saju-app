<!-- ⭐ 기존 스타일 유지 + 선택 UI만 교체 -->
<!-- 기존 CSS/디자인은 그대로 두고 이 JS만 추가하면 됨 -->

<script>
let state = {
  year:null,
  month:null,
  day:null,
  hour:null
};

/* 🔥 바텀시트 생성 */
const sheet = document.createElement("div");
sheet.style.cssText = `
position:fixed;
bottom:-100%;
left:0;
right:0;
height:60%;
background:#0d0b14;
border-top:1px solid #2a2438;
overflow-y:auto;
transition:0.3s;
z-index:9999;
`;
document.body.appendChild(sheet);

function openSheet(type){
  sheet.innerHTML = "";

  let list = [];

  if(type==="year"){
    for(let i=new Date().getFullYear(); i>=1920; i--) list.push(i);
  }
  if(type==="month"){
    for(let i=1;i<=12;i++) list.push(i);
  }
  if(type==="day"){
    const days = new Date(state.year || 2000, state.month || 1, 0).getDate();
    for(let i=1;i<=days;i++) list.push(i);
  }
  if(type==="hour"){
    list = ["모름"];
    for(let i=0;i<24;i++) list.push(i);
  }

  list.forEach(v=>{
    const item = document.createElement("div");
    item.style.cssText = `
      padding:16px;
      text-align:center;
      border-bottom:1px solid #1a1828;
      color:#c8b89a;
      cursor:pointer;
    `;
    item.innerText = v;

    item.onclick = ()=>{
      state[type] = v;

      // 텍스트 반영
      document.getElementById(type+"Text").innerText = v;

      sheet.style.bottom = "-100%";

      // 저장
      localStorage.setItem("sajuData", JSON.stringify(state));
    };

    sheet.appendChild(item);
  });

  sheet.style.bottom = "0";
}

/* 🔥 기존 클릭 이벤트 연결 */
document.getElementById("yearText").onclick = ()=>openSheet("year");
document.getElementById("monthText").onclick = ()=>openSheet("month");
document.getElementById("dayText").onclick = ()=>openSheet("day");
document.getElementById("hourText").onclick = ()=>openSheet("hour");

/* 🔥 자동 불러오기 */
const saved = localStorage.getItem("sajuData");
if(saved){
  state = JSON.parse(saved);

  if(state.year) document.getElementById("yearText").innerText = state.year;
  if(state.month) document.getElementById("monthText").innerText = state.month;
  if(state.day) document.getElementById("dayText").innerText = state.day;
  if(state.hour!==null) document.getElementById("hourText").innerText = state.hour;
}
</script>
