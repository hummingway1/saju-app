<script>
/* ══════════════════════════════
   은하수 캔버스 — 점 반짝임
══════════════════════════════ */
(function() {
  const canvas = document.getElementById('galaxy-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, stars = [], nebula = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = Math.max(window.innerHeight, document.body.scrollHeight, 3000);
    initStars();
  }

  function rand(min, max) { return min + Math.random() * (max - min); }

  function initStars() {
    stars = []; nebula = [];
    const count = Math.floor((W * H) / 2200);

    for (let i = 0; i < count; i++) {
      const tier = Math.random();
      stars.push({
        x: rand(0, W),
        y: rand(0, H),
        // 작고 선명한 점으로만
        r: tier < 0.04 ? rand(1.2, 1.8) :
           tier < 0.18 ? rand(0.6, 1.0) :
                         rand(0.2, 0.5),
        baseAlpha: tier < 0.04 ? rand(0.7, 1.0) :
                   tier < 0.18 ? rand(0.3, 0.6) :
                                 rand(0.1, 0.3),
        speed: rand(0.4, 1.8),
        offset: rand(0, Math.PI * 2),
        // 색상: 거의 흰색, 가끔 푸르스름
        color: tier < 0.06
          ? `hsl(${rand(200,240)},60%,92%)`
          : tier < 0.12
          ? `hsl(${rand(35,50)},50%,92%)`
          : '#f0ece4'
      });
    }

    // 은하수 성운 (매우 옅게)
    for (let i = 0; i < 8; i++) {
      nebula.push({
        x: rand(0, W), y: rand(0, H),
        rx: rand(80, 220), ry: rand(30, 90),
        angle: rand(0, Math.PI),
        alpha: rand(0.008, 0.022),
        hue: Math.random() < 0.5 ? 240 : 270
      });
    }
  }

  let t = 0;
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // 딥 스페이스 배경
    const bg = ctx.createLinearGradient(0, 0, W * 0.4, H);
    bg.addColorStop(0, '#04030a');
    bg.addColorStop(0.35, '#060418');
    bg.addColorStop(0.65, '#050310');
    bg.addColorStop(1, '#030208');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // 은하수 밴드 (매우 옅게)
    ctx.save();
    ctx.translate(W/2, H/2); ctx.rotate(-0.28); ctx.translate(-W/2, -H/2);
    const mw = ctx.createLinearGradient(W*0.05, 0, W*0.95, H);
    mw.addColorStop(0,   'rgba(50,30,80,0)');
    mw.addColorStop(0.3, 'rgba(70,45,110,0.05)');
    mw.addColorStop(0.5, 'rgba(90,55,140,0.09)');
    mw.addColorStop(0.7, 'rgba(65,40,100,0.05)');
    mw.addColorStop(1,   'rgba(40,25,60,0)');
    ctx.fillStyle = mw;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // 성운 (옅게)
    nebula.forEach(n => {
      ctx.save();
      ctx.translate(n.x, n.y); ctx.rotate(n.angle);
      const ng = ctx.createRadialGradient(0,0,0, 0,0,n.rx);
      ng.addColorStop(0, `hsla(${n.hue},55%,55%,${n.alpha*1.4})`);
      ng.addColorStop(0.5, `hsla(${n.hue},45%,45%,${n.alpha})`);
      ng.addColorStop(1, `hsla(${n.hue},35%,35%,0)`);
      ctx.fillStyle = ng;
      ctx.scale(1, n.ry/n.rx);
      ctx.beginPath(); ctx.arc(0,0,n.rx,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });

    // 별 — 순수한 점 + 반짝임
    t += 0.012;
    stars.forEach(s => {
      const twinkle = Math.sin(t * s.speed + s.offset);
      const alpha = s.baseAlpha * (0.5 + 0.5 * ((twinkle + 1) / 2));

      // 큰 별만 아주 작은 글로우
      if (s.r > 1.0) {
        const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 3);
        glow.addColorStop(0, `rgba(240,235,225,${alpha * 0.35})`);
        glow.addColorStop(1, 'rgba(240,235,225,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
        ctx.fill();

        // 십자 빛줄기 (아주 가늘게)
        if (s.r > 1.3) {
          ctx.save();
          ctx.globalAlpha = alpha * 0.18;
          ctx.strokeStyle = '#f0ece4';
          ctx.lineWidth = 0.4;
          const len = s.r * 7;
          ctx.beginPath();
          ctx.moveTo(s.x - len, s.y); ctx.lineTo(s.x + len, s.y);
          ctx.moveTo(s.x, s.y - len); ctx.lineTo(s.x, s.y + len);
          ctx.stroke();
          ctx.restore();
        }
      }

      // 별 본체 — 선명한 점
      ctx.globalAlpha = alpha;
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    });

    // 상단 황금 안개
    const topFog = ctx.createRadialGradient(W/2, -50, 0, W/2, -50, W * 0.65);
    topFog.addColorStop(0, 'rgba(201,169,110,0.035)');
    topFog.addColorStop(1, 'rgba(201,169,110,0)');
    ctx.fillStyle = topFog;
    ctx.fillRect(0, 0, W, H * 0.55);

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', () => {
    clearTimeout(window._rt);
    window._rt = setTimeout(resize, 200);
  });

  window.addEventListener('scroll', () => {
    const newH = Math.max(window.innerHeight, document.body.scrollHeight);
    if (newH > H + 200) { H = canvas.height = newH + 500; }
  });

  resize();
  draw();
})();

let audioCtx=null, soundOn=false, activeNodes=[], ambientInterval=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}
function createReverb(ctx){const c=ctx.createConvolver(),b=ctx.createBuffer(2,ctx.sampleRate*5,ctx.sampleRate);for(let i=0;i<2;i++){const ch=b.getChannelData(i);for(let j=0;j<ch.length;j++)ch[j]=(Math.random()*2-1)*Math.pow(1-j/ch.length,2.2);}c.buffer=b;return c;}
let reverbNode=null,masterGain=null;
function setupChain(){if(!audioCtx)return;if(!reverbNode)reverbNode=createReverb(audioCtx);if(!masterGain){masterGain=audioCtx.createGain();masterGain.gain.value=0.55;reverbNode.connect(masterGain);masterGain.connect(audioCtx.destination);}}
function playCrystalBowl(freq,duration,delay=0,vol=0.13){
  if(!audioCtx||!soundOn)return;setupChain();const now=audioCtx.currentTime+delay;
  [[freq,vol,0.12,true],[freq*2.756,vol*0.25,0.06,true],[freq*5.4,vol*0.08,0.03,false]].forEach(([f,v,att,rev],i)=>{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(v,now+att);
    if(i===0){g.gain.setTargetAtTime(v*0.55,now+0.5,1.5);g.gain.setTargetAtTime(0.0001,now+duration*0.45,duration*0.4);}
    else if(i===1){g.gain.setTargetAtTime(0.0001,now+1.0,1.8);}
    else{g.gain.setTargetAtTime(0.0001,now+0.5,0.6);}
    o.connect(g);g.connect(rev?reverbNode:audioCtx.destination);o.start(now);o.stop(now+duration+2);activeNodes.push(o);
  });
}
let droneOsc=null,droneGain=null;
function startDrone(){if(!audioCtx||!soundOn)return;setupChain();droneOsc=audioCtx.createOscillator();droneGain=audioCtx.createGain();droneOsc.type='sine';droneOsc.frequency.value=54;droneGain.gain.setValueAtTime(0,audioCtx.currentTime);droneGain.gain.linearRampToValueAtTime(0.035,audioCtx.currentTime+4);droneOsc.connect(droneGain);droneGain.connect(reverbNode);droneOsc.start();activeNodes.push(droneOsc);}
function stopDrone(){if(droneGain&&audioCtx){try{droneGain.gain.linearRampToValueAtTime(0,audioCtx.currentTime+2);setTimeout(()=>{try{droneOsc.stop();}catch(e){}},2200);}catch(e){}}}
const bowlFreqs=[108,136,174,198,216,144,162];let bowlIdx=0;
function scheduleNextBowl(){if(!soundOn)return;playCrystalBowl(bowlFreqs[bowlIdx++%bowlFreqs.length],14+Math.random()*6,0,0.13);ambientInterval=setTimeout(scheduleNextBowl,10000+Math.random()*12000);}
function startAmbient(){setupChain();startDrone();playCrystalBowl(174,16,0.8,0.13);playCrystalBowl(136,14,4,0.09);ambientInterval=setTimeout(scheduleNextBowl,16000);}
function stopAmbient(){if(ambientInterval)clearTimeout(ambientInterval);stopDrone();activeNodes.forEach(n=>{try{n.stop();}catch(e){}});activeNodes=[];reverbNode=null;masterGain=null;}
function toggleSound(){initAudio();soundOn=!soundOn;const btn=document.getElementById('sound-btn');if(soundOn){btn.classList.add('active');startAmbient();}else{btn.classList.remove('active');stopAmbient();}}

const ITEM_H=44,VISIBLE=5;
function createDrum(el,items,initVal,onChange,disabled){
  el.style.height=(ITEM_H*VISIBLE)+"px";el.innerHTML="";
  if(disabled)el.classList.add("disabled");else el.classList.remove("disabled");
  let baseIdx=Math.max(0,items.indexOf(initVal));let drag={on:false,startY:0,dy:0};
  const fadeT=document.createElement("div");fadeT.className="drum-fade-top";fadeT.style.height=ITEM_H*2+"px";
  const fadeB=document.createElement("div");fadeB.className="drum-fade-bot";fadeB.style.height=ITEM_H*2+"px";
  const sel=document.createElement("div");sel.className="drum-selector";sel.style.cssText=`top:${ITEM_H*2}px;height:${ITEM_H}px`;
  const list=document.createElement("div");list.className="drum-list";
  items.forEach((item,i)=>{
    const d=document.createElement("div");d.className="drum-item far";d.style.height=ITEM_H+"px";d.style.fontSize="13px";d.textContent=item;
    d.onclick=()=>{if(!disabled){baseIdx=i;render();onChange(items[i]);}};list.appendChild(d);
  });
  el.appendChild(fadeT);el.appendChild(fadeB);el.appendChild(sel);el.appendChild(list);
  function clamp(v){return Math.max(0,Math.min((items.length-1)*ITEM_H,v));}
  function snapI(v){return Math.round(clamp(v)/ITEM_H);}
  function liveRaw(){return baseIdx*ITEM_H+(drag.on?drag.dy:0);}
  function render(){
    const ai=snapI(liveRaw());const ty=-clamp(liveRaw())+ITEM_H*2;
    list.style.transition=drag.on?"none":"transform 0.22s cubic-bezier(.25,.8,.25,1)";
    list.style.transform=`translateY(${ty}px)`;
    list.childNodes.forEach((d,i)=>{const dist=Math.abs(i-ai);d.className="drum-item "+(dist===0?"active":dist===1?"near":"far");d.style.fontSize=dist===0?"19px":"13px";d.style.fontWeight=dist===0?"500":"400";});
  }
  render();
  if(!disabled){
    el.addEventListener("mousedown",e=>{drag={on:true,startY:e.clientY,dy:0};});
    el.addEventListener("touchstart",e=>{drag={on:true,startY:e.touches[0].clientY,dy:0};e.preventDefault();},{passive:false});
    window.addEventListener("mousemove",e=>{if(!drag.on)return;drag.dy=drag.startY-e.clientY;render();});
    window.addEventListener("touchmove",e=>{if(!drag.on)return;drag.dy=drag.startY-e.touches[0].clientY;render();});
    window.addEventListener("mouseup",()=>{if(!drag.on)return;baseIdx=snapI(liveRaw());drag={on:false,startY:0,dy:0};onChange(items[baseIdx]);render();});
    window.addEventListener("touchend",()=>{if(!drag.on)return;baseIdx=snapI(liveRaw());drag={on:false,startY:0,dy:0};onChange(items[baseIdx]);render();});
  }
  return{setValue(val){const i=items.indexOf(val);if(i>=0){baseIdx=i;render();}},enable(){el.classList.remove("disabled");disabled=false;},disable(){el.classList.add("disabled");disabled=true;}};
}

const CY=new Date().getFullYear();
const years=Array.from({length:110},(_,i)=>CY-i);
const months=Array.from({length:12},(_,i)=>i+1);
let state={year:1990,month:6,day:15,hour:null,minute:null,gender:null};
function getDays(y,m){return Array.from({length:new Date(y,m,0).getDate()},(_,i)=>i+1);}
function getHours(){const t=T[currentLang];return[t.hourUnknown,...Array.from({length:24},(_,i)=>String(i).padStart(2,"0"))];}
function getMinutes(){const t=T[currentLang];return[t.minuteUnknown,...Array.from({length:60},(_,i)=>String(i).padStart(2,"0"))];}

let drumYear,drumMonth,drumDay,drumHour,drumMinute;
function initPickers(){
  drumYear=createDrum(document.getElementById("drum-year"),years,state.year,v=>{state.year=v;refreshDays();},false);
  drumMonth=createDrum(document.getElementById("drum-month"),months,state.month,v=>{state.month=v;refreshDays();},false);
  drumDay=createDrum(document.getElementById("drum-day"),getDays(state.year,state.month),state.day,v=>{state.day=v;},false);
  const hours=getHours();state.hour=hours[0];
  drumHour=createDrum(document.getElementById("drum-hour"),hours,state.hour,v=>{
    state.hour=v;const t=T[currentLang];const noTime=v===t.hourUnknown;
    document.getElementById("time-hint").style.display=noTime?"block":"none";
    document.getElementById("sep-time").className="picker-sep"+(noTime?" dim":"");
    document.getElementById("label-minute").className="drum-label"+(noTime?" disabled":"");
    if(noTime){drumMinute.disable();state.minute=t.minuteUnknown;}else drumMinute.enable();
  },false);
  const minutes=getMinutes();state.minute=minutes[0];
  drumMinute=createDrum(document.getElementById("drum-minute"),minutes,state.minute,v=>{state.minute=v;},true);
}
function rebuildTimePickers(){
  const hours=getHours();const minutes=getMinutes();
  drumHour=createDrum(document.getElementById("drum-hour"),hours,hours[0],v=>{
    state.hour=v;const t=T[currentLang];const noTime=v===t.hourUnknown;
    document.getElementById("time-hint").style.display=noTime?"block":"none";
    document.getElementById("sep-time").className="picker-sep"+(noTime?" dim":"");
    document.getElementById("label-minute").className="drum-label"+(noTime?" disabled":"");
    if(noTime){drumMinute.disable();state.minute=t.minuteUnknown;}else drumMinute.enable();
  },false);
  state.hour=hours[0];
  drumMinute=createDrum(document.getElementById("drum-minute"),minutes,minutes[0],v=>{state.minute=v;},true);
  state.minute=minutes[0];document.getElementById("time-hint").style.display="block";
}
function refreshDays(){
  const newDays=getDays(state.year,state.month);const el=document.getElementById("drum-day");el.innerHTML="";
  const newVal=state.day>newDays.length?newDays[newDays.length-1]:state.day;state.day=newVal;
  drumDay=createDrum(el,newDays,newVal,v=>{state.day=v;},false);
}
function selectGender(g){
  state.gender=g;
  document.getElementById("btn-male").className="gender-btn"+(g==="male"?" active":"");
  document.getElementById("btn-female").className="gender-btn"+(g==="female"?" active":"");
  document.getElementById("gender-hint").style.display="none";
  document.getElementById("analyze-btn").className="analyze-btn ready";
}
let msgTimer;
function startLoadingMsgs(){const msgs=T[currentLang].loading;let i=0;document.getElementById("loading-msg").textContent=msgs[0];msgTimer=setInterval(()=>{i=(i+1)%msgs.length;document.getElementById("loading-msg").textContent=msgs[i];},1800);}
function stopLoadingMsgs(){clearInterval(msgTimer);}

async function analyze(){
  if(!state.gender)return;
  const t=T[currentLang];
  document.getElementById("error-box").style.display="none";
  document.getElementById("loading").style.display="flex";
  document.getElementById("form-section").style.display="none";
  startLoadingMsgs();
  const hourVal=(state.hour===t.hourUnknown)?"모름":state.hour;
  const minuteVal=(state.minute===t.minuteUnknown||state.minute==="—")?"모름":state.minute;
  try{
    const res=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({year:state.year,month:state.month,day:state.day,hour:hourVal,minute:minuteVal,gender:state.gender,lang:currentLang})});
    const data=await res.json();
    if(data.error)throw new Error(data.error);
    stopLoadingMsgs();document.getElementById("loading").style.display="none";showResult(data);
  }catch(e){
    stopLoadingMsgs();document.getElementById("loading").style.display="none";document.getElementById("form-section").style.display="block";
    const eb=document.getElementById("error-box");eb.textContent=(currentLang==="ko"?"오류: ":"Error: ")+e.message;eb.style.display="block";
  }
}
function showResult(data){
  const t=T[currentLang];
  const gl=state.gender==="male"?t.genderMale:t.genderFemale;
  document.getElementById("result-meta").textContent=currentLang==="ko"?`${state.year}년 ${state.month}월 ${state.day}일 · ${gl}`:`${state.month}/${state.day}/${state.year} · ${gl}`;
  document.getElementById("result-headline").textContent=data.headline||"";
  document.getElementById("result-essence").textContent=data.essence||"";
  const container=document.getElementById("result-sections");container.innerHTML="";
  (data.sections||[]).forEach((sec,i)=>{
    const div=document.createElement("div");div.className="section";div.style.transitionDelay=(i*0.07)+"s";
    div.innerHTML=`<div class="section-title-wrap"><span class="section-icon">${sec.icon}</span><span class="section-title">${sec.title}</span></div><div class="section-body">${sec.body}</div>`;
    container.appendChild(div);
  });
  if(data.locked){
    const wrap=document.getElementById("locked-wrap");wrap.style.display="block";
    const cards=document.getElementById("locked-cards");cards.innerHTML="";
    const cy=new Date().getFullYear();const cm=new Date().getMonth()+1;
    [{title:t.periods[0],preview:data.locked.periods?.early||""},{title:t.periods[1],preview:data.locked.periods?.mid||""},{title:t.periods[2],preview:data.locked.periods?.late||""},{title:`${cy}${t.yearly}`,preview:data.locked.yearly?.[0]?.fortune||""},{title:`${cy+1}${t.yearly}`,preview:data.locked.yearly?.[1]?.fortune||""},{title:currentLang==="ko"?`${cm}월 ${t.monthly}`:t.monthly,preview:data.locked.monthly||""},{title:t.daily,preview:data.locked.daily||""}].forEach(item=>{
      const card=document.createElement("div");card.className="locked-card";
      card.innerHTML=`<div class="locked-card-inner"><div class="locked-card-title">${item.title}</div><div class="locked-card-preview">${item.preview.substring(0,80)}...</div></div><div class="locked-overlay"><div class="lock-icon">🔒</div><div class="locked-label">${t.locked}</div></div>`;
      cards.appendChild(card);
    });
  }
  document.getElementById("result").style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
  const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add("visible");});},{threshold:0.05});
  document.querySelectorAll(".section").forEach(s=>obs.observe(s));
}
function resetApp(){
  document.getElementById("result").style.display="none";
  document.getElementById("locked-wrap").style.display="none";
  document.getElementById("form-section").style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
}

initPickers();
setLang(currentLang);
</script>
